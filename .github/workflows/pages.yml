name: Deploy Premium Laudos site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare radiology hero asset
        run: |
          mkdir -p assets
          curl -L --fail --retry 3 'https://betinhomaua-droid.github.io/premium-laudos-site/assets/radiologia-hero.png' -o assets/radiologia-hero.png
          test -s assets/radiologia-hero.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
